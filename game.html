<!DOCTYPE html>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:#05080d;

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

button{

  font:inherit;

  -webkit-tap-highlight-color:transparent;

}


/* =========================================================
   APP
========================================================= */

.game-app{

  position:relative;

  width:100%;
  height:100vh;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(25,116,61,.58),
      rgba(8,43,24,.88) 42%,
      #05080d 100%
    );

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:100;

  height:60px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    8px
    12px;

  background:
    rgba(4,7,12,.95);

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:blur(12px);

}

.top-title{

  font-size:15px;

  font-weight:1000;

  letter-spacing:1.6px;

}

.top-subtitle{

  margin-top:3px;

  color:#778396;

  font-size:8px;

  font-weight:800;

  letter-spacing:.8px;

}

.top-right{

  display:flex;

  align-items:center;

  gap:6px;

}

.mode-badge{

  padding:
    6px
    8px;

  border-radius:9px;

  background:#17202e;

  color:#c8d0dc;

  font-size:8px;

  font-weight:900;

}

.token-badge{

  padding:
    6px
    8px;

  border-radius:9px;

  background:#29220e;

  color:#ffd45b;

  font-size:9px;

  font-weight:900;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  position:absolute;

  top:69px;

  left:50%;

  z-index:80;

  width:min(90vw,430px);

  transform:
    translateX(-50%);

  padding:
    8px
    12px;

  border-radius:10px;

  background:
    rgba(5,9,14,.82);

  border:
    1px solid
    rgba(255,255,255,.06);

  color:#bdc6d4;

  text-align:center;

  font-size:9px;

}


/* =========================================================
   TABLE
========================================================= */

.table{

  position:absolute;

  left:50%;
  top:50%;

  width:min(75vw,470px);

  aspect-ratio:1/1;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 40%,
      #1b7540,
      #0d552c 55%,
      #07351d 100%
    );

  border:
    9px solid
    #171e26;

  box-shadow:

    0 30px 90px
    rgba(0,0,0,.70),

    inset 0 0 70px

}


/* =========================================================
   TABLE CENTER
========================================================= */

.table-center{

  position:absolute;

  left:50%;
  top:50%;

  width:155px;

  transform:
    translate(-50%,-50%);

}

.table-icon{

  font-size:36px;

}

.table-name{

  margin-top:7px;

.table-rule{

  font-size:7px;

/* =========================================================
   PLAYERS
========================================================= */

.player-seat{

.seat-avatar{

  border-radius:50%;

}

.player-seat.you

  border-color:#ffd45b;

  box-shadow:

}

.seat-name{

  font-size:8px;

.seat-info{

/* =========================================================

========================================================= */

.mode-6 .seat-1{

/* =========================================================
   PLAY AREA
========================================================= */

.play-area{

  left:50%;
  top:50%;

  height:150px;

    translate(-50%,-50%);

}

.played{

}

}

.played.p2{

}

/* =========================================================

========================================================= */

.scoreboard{

/* =========================================================

.hand{

.card{

/* =========================================================
   ACTIONS
========================================================= */

.actions{

.action{

/* =========================================================
   BID MODAL
========================================================= */

.modal{

  position:absolute;

  inset:0;

  z-index:500;

  align-items:center;

  justify-content:center;

  background:

}

.modal.show{

}

.modal-box{

.modal-title{

.modal-text{

.bid-grid{

.bid-button{

.modal-close{

/* =========================================================

  }

}

</style>

</head>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){

  try{

    tg.ready();
    tg.expand();

  }catch(e){}

}


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


let mode =
  params.get(
    "mode"
  ) || "6";


if(
  !["6","4","2"].includes(
    mode
  )
){

  mode =
    "6";

}


const tableType =
  params.get(
    "table"
  ) || "public";


const room =
  params.get(
    "room"
  ) || "PUBLIC";


/* =========================================================
   CONFIG
========================================================= */

const GAME_CONFIG = {

  "6":{

    title:
      "SPADE TRUMP",

    subtitle:
      "6 PLAYER • 3 VS 3",

    badge:
      "6 PLAYERS",

    icon:
      "♠",

    rule:
      "6 PLAYERS • 3 VS 3<br>SPADES = TRUMP",

    players:
      6,

    team1:
      "BLUE TEAM",

    team2:
      "RED TEAM"

  },


  "4":{

    title:
      "CLASSIC SPADES",

    subtitle:
      "4 PLAYER • 2 VS 2",

    badge:
      "4 PLAYERS",

    icon:
      "♣",

    rule:
      "4 PLAYERS • 2 VS 2<br>SPADES = TRUMP",

    players:
      4,

    team1:
      "TEAM A",

    team2:
      "TEAM B"

  },


  "2":{

    title:
      "TWO PLAYER",

    subtitle:
      "2 PLAYER • HEAD TO HEAD",

    badge:
      "2 PLAYERS",

    icon:
      "🃏",

    rule:
      "2 PLAYERS<br>HEAD TO HEAD",

    players:
      2,

    team1:
      "PLAYER 1",

    team2:
      "PLAYER 2"

  }

};


const config =
  GAME_CONFIG[
    mode
  ];


/* =========================================================
   STATE
========================================================= */

let selectedCard =
  null;

let myBid =
  null;


/* =========================================================
   SETUP
========================================================= */

function setupGame(){

  const table =
    document.getElementById(
      "table"
    );


  table.classList.remove(
    "mode-6",
    "mode-4",
    "mode-2"
  );


  table.classList.add(
    "mode-" +
    mode
  );


  document.getElementById(
    "topSubtitle"
  ).textContent =
    config.subtitle;


  document.getElementById(
    "modeBadge"
  ).textContent =
    config.badge;


  document.getElementById(
    "tableIcon"
  ).textContent =
    config.icon;


  document.getElementById(
    "tableName"
  ).textContent =
    config.title;


  document.getElementById(
    "tableRule"
  ).innerHTML =
    config.rule;


  document.getElementById(
    "team1Label"
  ).textContent =
    config.team1;


  document.getElementById(
    "team2Label"
  ).textContent =
    config.team2;


  configurePlayers();

  configureHand();


  if(
    tableType ===
    "private"
  ){

    setMessage(
      "PRIVATE ROOM • " +
      room +
      " • " +
      config.badge
    );

  }else{

    setMessage(
      "PUBLIC " +
      config.badge +
      " • Waiting for players..."
    );

  }

}


/* =========================================================
   PLAYERS
========================================================= */

function configurePlayers(){

  document
    .querySelectorAll(
      ".player-seat"
    )
    .forEach(
      function(seat){

        seat.style.display =
          "none";

      }
    );


  for(
    let i = 1;
    i <= config.players;
    i++
  ){

    const seat =
      document.querySelector(
        '.player-seat[data-player="' +
        i +
        '"]'
      );


    if(!seat){

      continue;

    }


    seat.style.display =
      "block";


    const name =
      seat.querySelector(
        ".seat-name"
      );


    const info =
      seat.querySelector(
        ".seat-info"
      );


    if(i === 1){

      name.textContent =
        "You";

      info.textContent =
        "Bid —";

    }else{

      name.textContent =
        "Player " +
        i;

      info.textContent =
        "Waiting";

    }

  }

}


/* =========================================================
   HAND
========================================================= */

function configureHand(){

  const hand =
    document.getElementById(
      "hand"
    );


  hand.innerHTML =
    "";


  let cards =
    [];


  if(mode === "6"){

    cards = [

      ["A","♠",""],
      ["K","♠",""],
      ["Q","♠",""],
      ["J","♠",""],
      ["A","♥","red"],
      ["K","♥","red"],
      ["10","♣",""]

    ];

  }


  if(mode === "4"){

    cards = [

      ["A","♠",""],
      ["K","♠",""],
      ["Q","♠",""],
      ["J","♠",""],
      ["A","♥","red"],
      ["Q","♥","red"],
      ["10","♣",""]

    ];

  }


  if(mode === "2"){

    cards = [

      ["A","♠",""],
      ["K","♠",""],
      ["Q","♠",""],
      ["A","♥","red"],
      ["K","♥","red"],
      ["A","♣",""],
      ["A","♦","red"]

    ];

  }


  cards.forEach(
    function(data){

      const card =
        document.createElement(
          "button"
        );


      card.type =
        "button";


      card.className =
        "card " +
        data[2];


      card.innerHTML =
        '<span class="card-rank">' +
        data[0] +
        '</span>' +
        '<span class="card-suit">' +
        data[1] +
        '</span>';


      card.onclick =
        function(){

          selectCard(
            card
          );

        };


      hand.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   MESSAGE
========================================================= */

function setMessage(
  text
){

  document.getElementById(
    "gameMessage"
  ).textContent =
    text;

}


/* =========================================================
   BID
========================================================= */

function openBid(){

  document
    .getElementById(
      "bidModal"
    )
    .classList.add(
      "show"
    );

}


function closeBid(){

  document
    .getElementById(
      "bidModal"
    )
    .classList.remove(
      "show"
    );

}


function setBid(
  value
){

  myBid =
    value;


  const info =
    document.getElementById(
      "playerInfo1"
    );


  if(info){

    info.textContent =
      "Bid " +
      value;

  }


  closeBid();


  setMessage(
    "Your bid is " +
    value +
    ". Waiting for other players..."
  );

}


/* =========================================================
   CARD
========================================================= */

function selectCard(
  card
){

  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      function(item){

        item.classList.remove(
          "selected"
        );

      }
    );


  selectedCard =
    card;


  card.classList.add(
    "selected"
  );


  setMessage(
    "Card selected. Press PLAY CARD."
  );

}


/* =========================================================
   PLAY
========================================================= */

function playSelectedCard(){

  if(!selectedCard){

    setMessage(
      "Select a card first."
    );

    return;

  }


  const suit =
    selectedCard
      .querySelector(
        ".card-suit"
      )
      .textContent;


  const played =
    document.getElementById(
      "played1"
    );


  played.textContent =
    suit;


  played.classList.add(
    "show"
  );


  selectedCard.style.visibility =
    "hidden";


  selectedCard.classList.remove(
    "selected"
  );


  selectedCard =
    null;


  setMessage(
    "You played " +
    suit +
    "."
  );

}


/* =========================================================
   TOKEN DISPLAY
========================================================= */

function updateTokenDisplay(){

  let tokens =
    Number(
      localStorage.getItem(
        "spades_tokens"
      )
    );


  if(
    !Number.isFinite(
      tokens
    )
  ){

    tokens =
      100;

  }


  document.getElementById(
    "tokenCount"
  ).textContent =
    tokens.toLocaleString();

}


updateTokenDisplay();


/* =========================================================
   EXIT
========================================================= */

function exitGame(){

  window.location.href =

}
