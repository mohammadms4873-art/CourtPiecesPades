<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بازی آنلاین SPADES</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #ffffff;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Segoe UI, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      margin-top: 5px;
    }

    button {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #game-board {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
    }

    .table-area {
      position: relative;
      min-height: 250px;
      background: #15803d;
      border-radius: 12px;
      border: 4px solid #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px;
    }

    .hand {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
      justify-content: center;
    }

    .card {
      width: 70px;
      height: 100px;
      background: var(--card-bg);
      color: #000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .card.red {
      color: var(--danger-color);
    }

    .card.joker.red {
      color: var(--danger-color);
      border: 2px solid var(--danger-color);
      background: #fff5f5;
    }

    .card.joker.black {
      color: #0f172a;
      border: 2px solid #0f172a;
      background: #f8fafc;
    }

    .card-rank {
      font-size: 16px;
    }

    .card-suit {
      font-size: 24px;
      text-align: center;
    }

    #bid-controls {
      display: none;
      gap: 10px;
      margin-top: 10px;
    }

    #bid-controls button {
      width: auto;
      flex: 1;
    }

    .error-msg {
      color: var(--danger-color);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>بازی آنلاین SPADES</h1>

  <div id="lobby">
    <div class="form-group">
      <label for="name">نام بازیکن:</label>
      <input type="text" id="name" placeholder="نام خود را وارد کنید" />
    </div>

    <div class="form-group">
      <label for="mode">حالت بازی:</label>
      <select id="mode">
        <option value="spade6">۶ نفره (همراه با جوکر)</option>
        <option value="spade4">۴ نفره کلاسیک</option>
        <option value="spade2">۲ نفره</option>
      </select>
    </div>

    <div class="form-group">
      <label for="room-type">نوع اتاق:</label>
      <select id="room-type" onchange="togglePrivateInput()">
        <option value="public">عمومی (Matchmaking)</option>
        <option value="private">خصوصی با کد</option>
      </select>
    </div>

    <div class="form-group" id="private-code-group" style="display: none;">
      <label for="room-id">کد اتاق اختصاصی:</label>
      <input type="text" id="room-id" placeholder="مثلاً: PRV-1234" />
    </div>

    <button onclick="joinGame()">ورود به بازی</button>
    <div id="lobby-error" class="error-msg"></div>
  </div>

  <div id="game-board">
    <div class="status-bar">
      <div>اتاق: <span id="disp-room">-</span></div>
      <div>امتیاز تیم A: <span id="score-a">0</span></div>
      <div>امتیاز تیم B: <span id="score-b">0</span></div>
      <div>دست: <span id="disp-round">1</span>/6</div>
    </div>

    <div class="table-area" id="table-played"></div>

    <div id="bid-controls"></div>

    <div id="turn-info" style="text-align:center; font-weight:bold; color:var(--accent-color);"></div>

    <h3>کارت‌های شما:</h3>
    <div class="hand" id="my-hand"></div>
  </div>
</div>

<script>
  // اتصال هوشمند بدون نیاز به تنظیمات هاست مجزا
  const socket = io({
    transports: ["websocket", "polling"]
  });

  let currentRoomId = null;
  let mySeat = null;

  function togglePrivateInput() {
    const type = document.getElementById("room-type").value;
    document.getElementById("private-code-group").style.display =
      type === "private" ? "block" : "none";
  }

  function joinGame() {
    const name = document.getElementById("name").value.trim() || "بازیکن";
    const mode = document.getElementById("mode").value;
    const roomType = document.getElementById("room-type").value;
    const roomId = document.getElementById("room-id").value.trim();

    const payload = {
      name,
      mode,
      private: roomType === "private",
      roomId: roomType === "private" ? roomId : undefined
    };

    socket.emit("JOIN_ROOM", payload);
  }

  socket.on("connect", () => {
    console.log("ارتباط با سرور برقرار شد.");
  });

  socket.on("SERVER_ERROR", (data) => {
    alert(data.message || "خطایی رخ داد.");
  });

  socket.on("ROOM_UPDATE", (data) => {
    currentRoomId = data.roomId;
    mySeat = data.mySeat;

    document.getElementById("lobby").style.display = "none";
    document.getElementById("game-board").style.display = "flex";
    document.getElementById("disp-room").innerText = data.roomId;

    document.getElementById("turn-info").innerText =
      data.started ? "بازی شروع شد!" : "در انتظار تکمیل بازیکنان...";
  });

  socket.on("GAME_START", (data) => {
    renderHand(data.hand);
  });

  socket.on("BID_REQUEST", () => {
    const container = document.getElementById("bid-controls");
    container.innerHTML = "<b>اعلام حکم (Bid): </b>";
    container.style.display = "flex";

    for (let i = 0; i <= 7; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      btn.onclick = () => submitBid(i);
      container.appendChild(btn);
    }
  });

  function submitBid(amount) {
    socket.emit("BID", { roomId: currentRoomId, bid: amount });
    socket.emit("DECLARE_BID", { roomId: currentRoomId, bid: amount });
    document.getElementById("bid-controls").style.display = "none";
  }

  socket.on("GAME_STATE", (data) => {
    document.getElementById("score-a").innerText = data.scoreA;
    document.getElementById("score-b").innerText = data.scoreB;
    document.getElementById("disp-round").innerText = data.round;

    renderHand(data.hand);
    renderPlayed(data.played);

    const isMyTurn = data.turn === mySeat;
    document.getElementById("turn-info").innerText = isMyTurn
      ? "نوبت شماست! یک کارت انتخاب کنید."
      : `نوبت بازیکن صندلی ${data.turn} است.`;
  });

  socket.on("TRICK_UPDATE", (data) => {
    renderPlayed(data.played || []);
  });

  socket.on("ROUND_UPDATE", (data) => {
    document.getElementById("score-a").innerText = data.scoreA;
    document.getElementById("score-b").innerText = data.scoreB;
    document.getElementById("disp-round").innerText = data.round;
    renderHand(data.hand || []);
  });

  socket.on("GAME_OVER", (data) => {
    alert(`بازی تمام شد! برنده: تیم ${data.winner}`);
    location.reload();
  });

  function renderHand(hand) {
    const handContainer = document.getElementById("my-hand");
    handContainer.innerHTML = "";

    hand.forEach((card) => {
      const cardEl = createCardElement(card);
      cardEl.onclick = () => {
        socket.emit("PLAY_CARD", { roomId: currentRoomId, card });
      };
      handContainer.appendChild(cardEl);
    });
  }

  function renderPlayed(played) {
    const tableContainer = document.getElementById("table-played");
    tableContainer.innerHTML = "";

    played.forEach((p) => {
      const cardEl = createCardElement({ rank: p.rank, suit: p.suit });
      const wrap = document.createElement("div");
      wrap.style.textAlign = "center";
      wrap.innerHTML = `<span style="font-size:12px; color:#fff;">صندلی ${p.seat}</span>`;
      wrap.appendChild(cardEl);
      tableContainer.appendChild(wrap);
    });
  }

  function createCardElement(card) {
    const cardEl = document.createElement("div");
    cardEl.classList.add("card");

    if (card.rank === "Joker") {
      cardEl.classList.add("joker", card.suit);
      cardEl.innerHTML = `
        <div class="card-rank">JK</div>
        <div class="card-suit">${card.suit === "red" ? "🃏" : "🎭"}</div>
      `;
      return cardEl;
    }

    const isRed = card.suit === "♥" || card.suit === "♦";
    if (isRed) cardEl.classList.add("red");

    cardEl.innerHTML = `
      <div class="card-rank">${card.rank}</div>
      <div class="card-suit">${card.suit}</div>
    `;

    return cardEl;
  }
</script>
</body>
</html>
