<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>SPADES</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.screen{
    display:none;
    width:100%;
    min-height:100vh;
}

.screen.active{
    display:block;
}

/* =========================
   HOME
========================= */

#homeScreen{
    padding:18px 14px 30px;
    background:
        radial-gradient(circle at top,#162c49 0%,#07111f 48%,#030811 100%);
}

.header{
    text-align:center;
    padding-top:10px;
    margin-bottom:24px;
}

.spade{
    font-size:54px;
    line-height:1;
    margin-bottom:5px;
}

.title{
    font-size:34px;
    letter-spacing:7px;
    font-weight:900;
}

.subtitle{
    margin-top:7px;
    color:#9fb0c7;
    font-size:13px;
}

.tokenBar{
    width:100%;
    max-width:560px;
    margin:0 auto 20px;
    padding:12px 16px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:15px;
    background:rgba(255,255,255,.06);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.tokenLabel{
    color:#9fb0c7;
    font-size:12px;
}

.tokenValue{
    font-size:18px;
    font-weight:800;
}

.sectionTitle{
    max-width:560px;
    margin:0 auto 12px;
    font-size:15px;
    font-weight:800;
    color:#dbe7f7;
}

.games{
    width:100%;
    max-width:560px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.gameCard{
    width:100%;
    padding:17px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(
        145deg,
        rgba(24,46,76,.95),
        rgba(9,20,35,.98)
    );
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.gameTop{
    display:flex;
    align-items:center;
    gap:13px;
}

.gameIcon{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    background:rgba(255,255,255,.08);
}

.gameInfo{
    flex:1;
}

.gameName{
    font-size:18px;
    font-weight:900;
}

.gameDesc{
    margin-top:4px;
    color:#91a2b9;
    font-size:12px;
}

.gameButtons{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modeBtn{
    min-height:45px;
    border:none;
    border-radius:12px;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
}

.randomBtn{
    background:#fff;
    color:#07111f;
}

.privateBtn{
    background:#172b45;
    color:#fff;
    border:1px solid rgba(255,255,255,.13);
}

/* =========================
   PRIVATE MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:400px;
    padding:24px;
    border-radius:20px;
    background:#0d1c30;
    border:1px solid rgba(255,255,255,.12);
}

.modalTitle{
    font-size:22px;
    font-weight:900;
    margin-bottom:8px;
}

.modalText{
    color:#91a2b9;
    font-size:13px;
    line-height:1.5;
    margin-bottom:18px;
}

.input{
    width:100%;
    height:48px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:#07111f;
    color:#fff;
    font-size:16px;
    text-align:center;
    letter-spacing:3px;
    text-transform:uppercase;
}

.modalButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
}

.modalBtn{
    height:45px;
    border:none;
    border-radius:12px;
    font-weight:800;
}

.cancelBtn{
    background:#172b45;
    color:#fff;
}

.joinBtn{
    background:#fff;
    color:#07111f;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);
    background:#fff;
    color:#07111f;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<section id="homeScreen" class="screen active">

    <header class="header">

        <div class="spade">♠</div>

        <h1 class="title">SPADES</h1>

        <div class="subtitle">
            Enter the table. Play smart. Win big.
        </div>

    </header>

    <div class="tokenBar">

        <div>
            <div class="tokenLabel">AVAILABLE TOKENS</div>
            <div class="tokenValue" id="tokenValue">
                1,000
            </div>
        </div>

        <div>🪙</div>

    </div>

    <div class="sectionTitle">
        SELECT GAME
    </div>

    <div class="games">

        <!-- 6 PLAYERS -->

        <div class="gameCard">

            <div class="gameTop">

                <div class="gameIcon">♠</div>

                <div class="gameInfo">

                    <div class="gameName">
                        6 PLAYERS
                    </div>

                    <div class="gameDesc">
                        3 vs 3 • Full Game
                    </div>

                </div>

            </div>

            <div class="gameButtons">

                <button
                    class="modeBtn randomBtn"
                    onclick="startRandom(6)">
                    RANDOM MATCH
                </button>

                <button
                    class="modeBtn privateBtn"
                    onclick="openPrivate(6)">
                    PRIVATE ROOM
                </button>

            </div>

        </div>


        <!-- 4 PLAYERS -->

        <div class="gameCard">

            <div class="gameTop">

                <div class="gameIcon">♣</div>

                <div class="gameInfo">

                    <div class="gameName">
                        4 PLAYERS
                    </div>

                    <div class="gameDesc">
                        2 vs 2 • Classic Match
                    </div>

                </div>

            </div>

            <div class="gameButtons">

                <button
                    class="modeBtn randomBtn"
                    onclick="startRandom(4)">
                    RANDOM MATCH
                </button>

                <button
                    class="modeBtn privateBtn"
                    onclick="openPrivate(4)">
                    PRIVATE ROOM
                </button>

            </div>

        </div>


        <!-- 2 PLAYERS -->

        <div class="gameCard">

            <div class="gameTop">

                <div class="gameIcon">♦</div>

                <div class="gameInfo">

                    <div class="gameName">
                        2 PLAYERS
                    </div>

                    <div class="gameDesc">
                        1 vs 1 • Duel
                    </div>

                </div>

            </div>

            <div class="gameButtons">

                <button
                    class="modeBtn randomBtn"
                    onclick="startRandom(2)">
                    RANDOM MATCH
                </button>

                <button
                    class="modeBtn privateBtn"
                    onclick="openPrivate(2)">
                    PRIVATE ROOM
                </button>

            </div>

        </div>

    </div>

</section>


<!-- PRIVATE ROOM -->

<div id="privateModal" class="modal">

    <div class="modalBox">

        <div class="modalTitle">
            PRIVATE ROOM
        </div>

        <div class="modalText">
            Enter a room code to join your friends,
            or create a new private room.
        </div>

        <input
            id="roomCodeInput"
            class="input"
            maxlength="8"
            placeholder="ROOM CODE"
            autocomplete="off"
        >

        <div class="modalButtons">

            <button
                class="modalBtn cancelBtn"
                onclick="closePrivate()">
                CANCEL
            </button>

            <button
                class="modalBtn joinBtn"
                onclick="joinPrivate()">
                JOIN
            </button>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();
    tg.expand();

}


/* =========================
   PLAYER
========================= */

const savedTokens =
    Number(localStorage.getItem("spades_tokens"));

if(!Number.isNaN(savedTokens) && savedTokens >= 0){

    document.getElementById("tokenValue")
        .textContent =
        savedTokens.toLocaleString();

}


/* =========================
   STATE
========================= */

let selectedPlayers = null;


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2200);

}


/* =========================
   RANDOM MATCH
========================= */

function startRandom(players){

    if(![2,4,6].includes(players)){

        showToast("Invalid game mode");
        return;

    }

    const params =
        new URLSearchParams();

    params.set("players", players);
    params.set("mode", "random");

    /*
      مهم:
      game.html باید در همان پوشه
      index.html باشد.
    */

    window.location.href =
        "game.html?" +
        params.toString();

}


/* =========================
   PRIVATE ROOM
========================= */

function openPrivate(players){

    selectedPlayers = players;

    document
        .getElementById("roomCodeInput")
        .value = "";

    document
        .getElementById("privateModal")
        .classList.add("show");

    setTimeout(() => {

        document
            .getElementById("roomCodeInput")
            .focus();

    },100);

}


function closePrivate(){

    document
        .getElementById("privateModal")
        .classList.remove("show");

    selectedPlayers = null;

}


function joinPrivate(){

    if(!selectedPlayers){

        showToast("Select a game first");
        return;

    }

    let code =
        document
        .getElementById("roomCodeInput")
        .value
        .trim()
        .toUpperCase();

    /*
      اگر کد خالی باشد،
      اتاق خصوصی جدید ساخته می‌شود.
    */

    if(!code){

        code =
            Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();

    }

    const params =
        new URLSearchParams();

    params.set("players", selectedPlayers);
    params.set("mode", "private");
    params.set("room", code);

    window.location.href =
        "game.html?" +
        params.toString();

}


document
    .getElementById("privateModal")
    .addEventListener("click",function(e){

        if(e.target === this){

            closePrivate();

        }

    });


document
    .getElementById("roomCodeInput")
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            joinPrivate();

        }

    });

</script>

</body>
</html>
